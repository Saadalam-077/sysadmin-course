name: Deploy Supabase (database changes)

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zxqpcuncbpzxsaqmfcby
    steps:
      - uses: actions/checkout@v4

      - name: Check GitHub secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing (Settings → Secrets and variables → Actions). See RECOVERY_SETUP_AR.md"
            exit 1
          fi

      - name: Apply database changes (keeps all students and progress)
        run: |
          # Runs the SQL through Supabase's Management API (HTTPS), so no database password
          # or IPv6 connection is needed. The SQL only uses "if not exists", so re-running is safe.
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            jq -Rs '{query: .}' "$f" > /tmp/body.json
            status=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data @/tmp/body.json)
            cat /tmp/resp.txt; echo
            if [ "$status" -ge 300 ]; then echo "::error::Database update failed (HTTP $status)"; exit 1; fi
          done
